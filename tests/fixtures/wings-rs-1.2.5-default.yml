      enabled: false
      container_uid: 0
      container_gid: 0
    uid: 0
    gid: 0
  passwd:
    enabled: false
    directory: /run/calagopus-wings/etc
  machine_id:
    enabled: true
  disk_check_concurrency: 2
  disk_check_interval: 150
  full_disk_check_every: 4
