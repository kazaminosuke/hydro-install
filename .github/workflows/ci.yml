name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master, verified composite action
        with:
          severity: warning
          ignore_paths: manual-guides
          version: v0.11.0

  syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check syntax of all shell scripts
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! bash -n "$file"; then
              echo "::error file=$file::Syntax error in $file"
              failed=1
            else
              echo "✓ $file"
            fi
          done < <(find . -name '*.sh' -not -path './manual-guides/*' -print0)
          exit $failed

  wings-layout:
    name: Wings Layout Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run Wings layout tests
        run: bash tests/wings-layout-test.sh

  installer-safety:
    name: Installer Safety Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run installer safety tests
        run: |
          bash tests/security-defaults-test.sh
          bash tests/update-safety-test.sh
          bash tests/script-loading-test.sh

  permissions:
    name: Executable Permissions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify all shell scripts are executable
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! test -x "$file"; then
              echo "::error file=$file::$file is not executable"
              failed=1
            fi
          done < <(find . -name '*.sh' -not -path './manual-guides/*' -not -path './lib/lib.sh' -print0)
          exit $failed

  integration:
    name: Real systemd integration (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [layout, mariadb, wings-go, wings-rs]
    steps:
      - uses: actions/checkout@v5
      - name: Build disposable systemd container
        run: docker build -t hydro-itest tests/integration
      - name: Start container
        run: |
          docker run -d --name hit --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD":/src:ro \
            --tmpfs /run --tmpfs /run/lock hydro-itest
          for i in $(seq 60); do docker exec hit systemctl is-active -q docker && break; sleep 2; done
          docker exec hit cp -a /src /hydro
          docker exec hit docker pull -q busybox
      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            layout) cmd="bash /hydro/tests/integration/vm-wings-layout.sh" ;;
            mariadb) cmd="bash /hydro/tests/integration/mariadb.sh" ;;
            wings-go) cmd="bash /hydro/tests/integration/real-wings.sh go" ;;
            wings-rs) cmd="bash /hydro/tests/integration/real-wings.sh rs" ;;
          esac
          docker exec -e HYDRO_VM_TEST_I_AM_DISPOSABLE=1 hit bash -c "$cmd"
      - name: Show logs on failure
        if: failure()
        run: |
          docker exec hit bash -c 'tail -n 200 /tmp/real-wings-*.log 2>/dev/null; journalctl -u hydrodactyl-wings --no-pager -n 100 2>/dev/null' || true
